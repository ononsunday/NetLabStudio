[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab-studio"
version = "1.0.0"
description = "Native Windows networking and computer systems teaching laboratory"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6>=6.8,<7", "psutil>=6,<8", "scapy>=2.6,<3", "dnspython>=2.7,<3", "httpx[http2]>=0.28,<1", "cryptography>=44", "websockets>=14,<18", "aioquic>=1.2,<2", "asyncssh>=2.19,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
netlab-studio = "netlab.app:main"

[tool.setuptools.packages.find]
include = ["netlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

